      }).join('') + '</tbody></table></div></section>';

    return '<div class="gn gn-admin" data-mode="' + (opts.mode || 'app') + '">' + rail +
      '<div class="gn-admin-main">' + bar + graph + table + '</div></div>';
  };

  /* ------------------------------------------------------------------- auth */
  function constellation(animated) {
    var cx = 260, cy = 260;
    var rings = [
      { r: 74, n: 8, size: 4.6, fill: '#151033', stroke: 'rgba(142,111,255,0.85)', width: 1.3 },
      { r: 124, n: 11, size: 3.2, fill: '#08131c', stroke: 'rgba(53,214,222,0.6)', width: 1 },
      { r: 172, n: 8, size: 2.8, fill: '#0d0b1a', stroke: 'rgba(185,168,255,0.42)', width: 1 }
    ];
    var pos = rings.map(function (ring, ri) {
      var arr = [];
      for (var i = 0; i < ring.n; i++) {
        var a = -Math.PI / 2 + (i / ring.n) * Math.PI * 2 + ri * 0.34;
        arr.push({ x: cx + Math.cos(a) * ring.r, y: cy + Math.sin(a) * ring.r });
      }
      return arr;
    });

    var svg = '<svg class="gn-const" viewBox="0 0 520 520" fill="none" aria-hidden="true">' +
      '<defs><radialGradient id="gnc" cx="50%" cy="50%" r="50%">' +
      '<stop offset="0%" stop-color="#6c4bf2" stop-opacity="0.20"/>' +
      '<stop offset="55%" stop-color="#6c4bf2" stop-opacity="0.06"/>' +
      '<stop offset="100%" stop-color="#6c4bf2" stop-opacity="0"/>' +
      '</radialGradient></defs>' +
      '<circle cx="260" cy="260" r="225" fill="url(#gnc)"/>';
    svg += '<circle cx="260" cy="260" r="74" stroke="rgba(142,111,255,0.30)" stroke-width="1"/>';
    svg += '<circle cx="260" cy="260" r="124" stroke="rgba(53,214,222,0.20)" stroke-width="1" stroke-dasharray="2 7"/>';
    svg += '<circle cx="260" cy="260" r="172" stroke="rgba(185,168,255,0.16)" stroke-width="1" stroke-dasharray="1 8"/>';

    /* spokes from the centre to the first ring */
    pos[0].forEach(function (p) {
      svg += '<line class="c-edge" x1="' + cx + '" y1="' + cy + '" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '" stroke="rgba(142,111,255,0.30)"/>';
    });
    /* ties outward */
    var ties = [[0, 1], [1, 2]];
    ties.forEach(function (pair) {
      var from = pos[pair[0]], to = pos[pair[1]];
      from.forEach(function (p, i) {
        var j = Math.round((i / from.length) * to.length) % to.length;
        [j, (j + 1) % to.length].forEach(function (k) {
          var q = to[k];
          svg += '<line x1="' + p.x.toFixed(1) + '" y1="' + p.y.toFixed(1) + '" x2="' + q.x.toFixed(1) + '" y2="' + q.y.toFixed(1) + '" stroke="' +
            (pair[0] === 0 ? 'rgba(53,214,222,0.30)' : 'rgba(185,168,255,0.20)') + '" stroke-dasharray="2 4"/>';
        });
      });
    });

    pos.forEach(function (ring, ri) {
      ring.forEach(function (p, i) {
        svg += '<circle class="c-node" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + rings[ri].size + '" fill="' + rings[ri].fill +
          '" stroke="' + rings[ri].stroke + '" stroke-width="' + rings[ri].width + '"' +
          (animated ? ' style="animation:gn-pulse 5s ease-in-out ' + ((ri * 0.4 + i * 0.13).toFixed(2)) + 's infinite"' : '') + '/>';
      });
    });

    svg += '<circle cx="260" cy="260" r="19" fill="rgba(142,111,255,0.16)"/>';
    svg += '<circle cx="260" cy="260" r="10" fill="#6c4bf2" stroke="rgba(200,186,255,0.9)" stroke-width="1.4"/>';
    svg += '</svg>';
    return svg;
  }

  function authShell(inner, opts) {
    opts = opts || {};
    return '<div class="gn gn-auth" data-mode="' + (opts.mode || 'app') + '">' +
      '<div class="gn-auth-art"><div class="gn-brand" style="padding:0">' + brandMark(28) +
      '<span class="gn-wordmark" style="font-size:17px">GraphNet</span></div>' +
      '<div class="gn-auth-art-mid">' + constellation(opts.animated) + '</div>' +
      '<div class="gn-auth-claim">' +
      '<h2>Your network is not a list. It has a shape.</h2>' +
      '<p>GraphNet maps who you know, who they know, and how far apart you really are. Every connection is an edge you can see.</p>' +
      '<div class="gn-auth-proof">' +
      '<span class="gn-pf">' + icon('git-branch', 13) + 'Three degrees, mapped</span>' +
      '<span class="gn-pf">' + icon('database', 13) + 'Neo4j graph core</span>' +
      '</div></div></div>' +
      '<div class="gn-auth-panel"><div class="gn-auth-form">' + inner + '</div></div></div>';
  }

  function authMark() {
    return '<div class="gn-auth-brand">' + brandMark(24) + '<span class="gn-wordmark" style="font-size:15px">GraphNet</span></div>';
  }

  Screens.auth = function (a, b) {
    /* Called as auth(opts) from the prototype and auth(store, opts) from the
       canvas builder. Normalise so both get the same object. */
    var opts = (b !== undefined ? b : a) || {};
    var step = opts.step || 'email';
    var email = opts.email || '';
    var body = '', title = '', sub = '', foot = '', stepBar = '';

    if (step === 'email') {
      title = 'Sign in or create an account';
      sub = 'Enter your email. We check it against the account table, then take you to the right next step.';
      body = '<div class="gn-field"><label class="gn-label" for="auth-email">Email</label>' +
        '<input class="gn-input" id="auth-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" value="' + esc(email) + '">' +
        (opts.err ? '<div class="gn-err">' + icon('circle-alert', 14) + esc(opts.err) + '</div>' : '') + '</div>' +
        '<button class="gn-btn gn-btn-primary gn-btn-lg gn-btn-block" data-act="auth-email" style="margin-top:4px">Continue</button>' +
        '<div class="gn-auth-demo"><span class="gn-mono">alice@demo.test</span><span class="gn-dim">or</span><span class="gn-mono">admin@gmail.com</span></div>';
      foot = 'By continuing you agree to the terms of use and the privacy notice.';
    } else if (step === 'password' || step === 'password-error') {
      title = 'Enter your password';
      sub = 'Signing in as ' + esc(email || 'alice@demo.test') + '.';
      body = '<div class="gn-field"><div class="gn-flex gn-ic"><label class="gn-label" for="auth-pw">Password</label>' +
        '<button class="gn-btn gn-btn-ghost gn-btn-xs gn-ml-auto" data-act="auth-change-email">Change email</button></div>' +
        '<input class="gn-input' + (step === 'password-error' ? ' is-error' : '') + '" id="auth-pw" name="password" type="password" autocomplete="current-password" placeholder="Your password" value="' + (step === 'password-error' ? 'demo1234' : '') + '">' +
        (step === 'password-error' ? '<div class="gn-err">' + icon('circle-alert', 14) + 'That password does not match this account.</div>' : '') +
        '</div>' +
        '<button class="gn-btn gn-btn-primary gn-btn-lg gn-btn-block" data-act="auth-signin">Sign in</button>' +
        '<div class="gn-auth-demo"><span class="gn-dim">Demo password</span><span class="gn-mono">Demo@123</span></div>';
      foot = 'Trouble signing in? Ask an admin to reset your account.';
    } else if (step === 'create') {
      title = 'Create a password';
      sub = 'New account for ' + esc(email || 'jordan@mbeki.studio') + '.';
      var strength = opts.strength || 0;
      var labels = ['', 'Weak', 'Fair', 'Strong', 'Very strong'];
      stepBar = '<div class="gn-auth-step"><i class="on"></i><i class="on"></i><i></i><span>Step 2 of 3</span></div>';
      body = '<div class="gn-field"><label class="gn-label" for="auth-new">Password</label>' +
        '<input class="gn-input" id="auth-new" name="new-password" type="password" autocomplete="new-password" placeholder="6 to 64 characters" value="' + (opts.pw || '') + '">' +
        (opts.err ? '<div class="gn-err">' + icon('circle-alert', 14) + esc(opts.err) + '</div>' : '') +
        '</div>' +
        '<div><div class="gn-flex gn-ic" style="justify-content:space-between"><span class="gn-hint">Password strength</span>' +
        '<span class="gn-tiny" style="font-weight:600;color:' + (strength >= 3 ? 'var(--g-ok)' : strength === 2 ? 'var(--g-violet-3)' : 'var(--g-text-3)') + '">' + (labels[strength] || 'Too short') + '</span></div>' +
        '<div class="gn-meter" style="margin-top:7px"><i style="width:' + (strength / 4 * 100) + '%;background:' + (strength >= 3 ? 'var(--g-ok)' : strength === 2 ? 'var(--g-violet)' : 'var(--g-danger)') + '"></i></div></div>' +
        '<ul class="gn-tiny gn-dim" style="display:flex;flex-direction:column;gap:6px">' +
        ['6 to 64 characters', 'Letters and numbers', 'One special character'].map(function (t, i) {
          var on = strength > i;
          return '<li class="gn-flex gn-ic gn-gap-6" style="color:' + (on ? 'var(--g-text-2)' : 'var(--g-text-3)') + '">' +
            '<span style="color:' + (on ? 'var(--g-ok)' : '#4b5470') + '">' + icon(on ? 'circle-check' : 'dot', 13) + '</span>' + t + '</li>';
        }).join('') + '</ul>' +
        '<button class="gn-btn gn-btn-primary gn-btn-lg gn-btn-block" data-act="auth-create">Continue</button>';
      foot = 'Passwords are hashed with bcrypt and stored in SQLite only.';
    } else if (step === 'name') {
      title = 'What should people call you?';
      sub = 'This name sits on your node in the graph and on every connection card.';
      stepBar = '<div class="gn-auth-step"><i class="on"></i><i class="on"></i><i class="on"></i><span>Step 3 of 3</span></div>';
      body = '<div class="gn-field"><label class="gn-label" for="auth-name">Full name</label>' +
        '<input class="gn-input" id="auth-name" name="name" type="text" autocomplete="name" placeholder="Jordan Mbeki" value="' + esc(opts.name || '') + '" maxlength="60">' +
        '<span class="gn-hint">Between 3 and 60 characters.</span>' +
        (opts.err ? '<div class="gn-err">' + icon('circle-alert', 14) + esc(opts.err) + '</div>' : '') + '</div>' +
        '<div class="gn-card" style="padding:13px;display:flex;align-items:center;gap:11px;background:var(--g-surface-2)">' +
        '<span class="gn-ring gn-ring-0"><span class="gn-av gn-av-md ' + tint(opts.name || 'New Person') + '">' + initials(opts.name || 'New Person') + '</span></span>' +
        '<div><div class="gn-tiny gn-dim">Your node preview</div>' +
        '<div style="font-size:12.5px;font-weight:600;margin-top:2px">' + esc(opts.name || 'New Person') + '</div></div>' +
        icon('git-branch', 15, 'gn-dim') + '</div>' +
        '<button class="gn-btn gn-btn-primary gn-btn-lg gn-btn-block" data-act="auth-finish">Create account</button>';
      foot = 'You start with no connections. Discover people to send your first request.';
    }

    var inner = authMark() + stepBar +
      '<h1 class="gn-auth-title">' + title + '</h1>' +
      '<p class="gn-auth-sub">' + sub + '</p>' +
      '<div class="gn-auth-body">' + body + '</div>' +
      (foot ? '<p class="gn-auth-foot">' + foot + '</p>' : '');
    return authShell(inner, { mode: opts.mode, animated: opts.animated });
  };
  GN.Screens = Screens;
  GN.screens = function (name, store, opts) {
    return Screens[name] ? Screens[name](store || GN.store, opts || {}) : '';
  };

  root.GN = GN;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
(() => {
  // ═══════════════════════════════════════════════════════════
  // LOCALIZE: instantiating agent MUST translate every value in
  // UI_STRINGS to the user's conversation language. Machine fields
  // (id/class/data-*) remain English.
  // ═══════════════════════════════════════════════════════════
  const UI_STRINGS = {
    docTitle: 'GraphNet · Design Delivery',
    sections: {
      context: '01 PROJECT CONTEXT',
      designSystem: '02 DESIGN SYSTEM',
      deliverables: '03 DESIGN DELIVERABLES'
    },
    zoom: { zoomIn: 'Zoom in', zoomOut: 'Zoom out', reset: 'Reset view' },
    kbdHints: [['Scroll', 'pan'], ['Ctrl / \u2318 + Scroll', 'zoom'], ['Ctrl / \u2318 + Z', 'undo']]
  };

  // Chrome strings live in UI_STRINGS too — applied here so the static HTML
  // above carries no visible copy at all (machine-checkable invariant).
  document.title = UI_STRINGS.docTitle;
  document.getElementById('zoomIn').setAttribute('aria-label', UI_STRINGS.zoom.zoomIn);
  document.getElementById('zoomOut').setAttribute('aria-label', UI_STRINGS.zoom.zoomOut);
  document.getElementById('zoomReset').setAttribute('aria-label', UI_STRINGS.zoom.reset);
  document.getElementById('kbdHint').innerHTML = UI_STRINGS.kbdHints
    .map(([keys, action]) => `<span><kbd>${keys}</kbd> ${action}</span>`)
    .join('');

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const zoomLabel = document.getElementById('zoomLabel');
  const coordIndicator = document.getElementById('coordIndicator');

  /* ===== canvas state ===== */
  let panX = 0, panY = 0, zoom = 1;
  const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

  function updateTransform() {
    world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    updateGrid();
  }

  /* ===== dot grid ===== */
  function updateGrid() {
    const g = 40 * zoom;
    const ox = panX % g, oy = panY % g;
    viewport.style.backgroundImage = `radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)`;
    viewport.style.backgroundSize = `${g}px ${g}px`;
    viewport.style.backgroundPosition = `${ox}px ${oy}px`;
  }

  /* ===== panning ===== */
  let isPanning = false, panSX, panSY;

  viewport.addEventListener('pointerdown', (e) => {
    if (e.target === viewport || e.target === world) {
      isPanning = true;
      panSX = e.clientX - panX;
      panSY = e.clientY - panY;
      viewport.classList.add('panning');
      viewport.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!isPanning) return;
    panX = e.clientX - panSX;
    panY = e.clientY - panSY;
    updateTransform();
  });
  viewport.addEventListener('pointerup', () => {
    isPanning = false;
    viewport.classList.remove('panning');
  });

  /* ===== wheel: trackpad scroll = pan, pinch/ctrl+scroll = zoom ===== */
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();

    if (e.ctrlKey || e.metaKey) {
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    } else {
      const hasX = Math.abs(e.deltaX) > 0.5;
      if (hasX || Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3) {
        panX -= e.deltaX;
        panY -= e.deltaY;
      } else {
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
        const factor = e.deltaY > 0 ? 0.95 : 1.05;
        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
        panX = mx - wx * zoom;
        panY = my - wy * zoom;
      }
    }
    updateTransform();
  }, { passive: false });

  /* ===== zoom buttons ===== */
  function zoomAt(factor) {
    const r = viewport.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    panX = cx - wx * zoom;
    panY = cy - wy * zoom;
    updateTransform();
  }
  document.getElementById('zoomIn').onclick = () => zoomAt(1.25);
  document.getElementById('zoomOut').onclick = () => zoomAt(0.8);
  document.getElementById('zoomReset').onclick = () => { zoom = 1; panX = 0; panY = 0; updateTransform(); };
  document.getElementById('zoomReset').title = UI_STRINGS.zoom.reset;

  /* ===== coord indicator ===== */
  viewport.addEventListener('pointermove', (e) => {
    if (isPanning) return;
    const r = viewport.getBoundingClientRect();
    coordIndicator.textContent = `${Math.round((e.clientX - r.left - panX) / zoom)}, ${Math.round((e.clientY - r.top - panY) / zoom)}`;
  });

  /* ===== touch gestures ===== */
  let lastPinchDist = null, lastPinchCenter = null;

  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      lastPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      lastPinchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
      e.preventDefault();
    }
  }, { passive: false });

  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    if (lastPinchDist > 0) {
      const r = viewport.getBoundingClientRect();
      const mx = center.x - r.left, my = center.y - r.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * Math.pow(dist / lastPinchDist, 0.6)));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    }
    if (lastPinchCenter) {
      panX += center.x - lastPinchCenter.x;
      panY += center.y - lastPinchCenter.y;
    }
    lastPinchDist = dist;
    lastPinchCenter = center;
    updateTransform();
  }, { passive: false });

  viewport.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) { lastPinchDist = null; lastPinchCenter = null; }
  });

  /* ===== undo ===== */
  const undoStack = [];
  function saveUndo() {
    const s = [];
    world.querySelectorAll('.canvas-el').forEach(el => {
      s.push({ id: el.id, left: el.style.left, top: el.style.top });
    });
    undoStack.push({ panX, panY, zoom, assets: s });
    if (undoStack.length > 60) undoStack.shift();
  }
  function undo() {
    if (!undoStack.length) return;
    const st = undoStack.pop();
    panX = st.panX; panY = st.panY; zoom = st.zoom;
    st.assets.forEach(a => {
      const el = document.getElementById(a.id);
      if (el) { el.style.left = a.left; el.style.top = a.top; }
    });
    updateTransform();
  }
  document.addEventListener('keydown', (e) => {
    if (e.target instanceof Element && e.target.closest('input, textarea, select, [contenteditable]')) return;
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  });

  /* ===== draggable ===== */
  function makeDraggable(el) {
    let dragging = false, sx, sy, ox, oy;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || (e.target instanceof Element && e.target.closest('button, a, input, textarea, select, [contenteditable]'))) return;
      dragging = true;
      el.classList.add('dragging');
      saveUndo();
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
      el.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      el.style.left = (ox + (e.clientX - sx) / zoom) + 'px';
      el.style.top = (oy + (e.clientY - sy) / zoom) + 'px';
    });
    el.addEventListener('pointerup', () => {
      if (dragging) { dragging = false; el.classList.remove('dragging'); }
    });
  }

  /* ===== unique id ===== */
  let _id = 0;
  function uid(prefix) { return (prefix || 'el') + '-' + (++_id); }

  /* ===== API: addSection ===== */
  function addSection(rowY, label) {
    const parts = label.split(' ');
    const num = parts[0] || '';
    const rest = parts.slice(1).join(' ');
    const el = document.createElement('div');
    el.className = 'section-header';
    el.style.left = '60px';
    el.style.top = rowY + 'px';
    el.innerHTML = `<span class="section-line"></span><span class="section-num">${num}</span><span class="section-label">${rest}</span>`;
    world.appendChild(el);
    return rowY;
  }

  /* ===== API: addTitle ===== */
  function addTitle(x, y, text, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-title';
    el.id = uid('title');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 48) + 'px';
    if (options.fontWeight) el.style.fontWeight = options.fontWeight;
    if (options.color) el.style.color = options.color;
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el);
    return el;
  }

  /* ===== API: addText ===== */
  function addText(x, y, text, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-text canvas-el';
    el.id = uid('text');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 14) + 'px';
    if (options.color) el.style.color = options.color;
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addTag ===== */
  function addTag(x, y, label, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('tag');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    const dotColor = options.color || 'var(--accent)';
    el.innerHTML = `<div class="canvas-tag"><span class="tag-dot" style="background:${dotColor}"></span>${label}</div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addContextCard ===== */
  function addContextCard(x, y, w, h, title, content) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('ctx');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    if (h) el.style.height = h + 'px';
    el.innerHTML = `<div class="context-card" style="width:100%;${h ? 'height:100%' : ''}">
      <div class="card-head"><div class="head-indicator"></div><h3>${title}</h3></div>
      <div class="card-content">${content}</div>

  /* ===== API: addDesignSystemCard ===== */
  function addDesignSystemCard(x, y, w, h, type, data) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('ds');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    if (h) el.style.height = h + 'px';

    let body = '';
    if (type === 'color' && Array.isArray(data.colors)) {
      body = `<div class="color-grid">${data.colors.map(c =>
        `<div class="color-chip" style="background:${c.hex}"><span class="chip-label">${c.name || c.hex}</span></div>`
      ).join('')}</div>`;
    } else if (type === 'typography' && Array.isArray(data.samples)) {
      body = `<div class="type-stack">${data.samples.map(s =>
        `<div class="type-row"><span class="type-label">${s.label}</span><span class="type-sample" style="font-size:${s.size}px;font-weight:${s.weight || 400}">${s.text || 'Aa'}</span></div>`
      ).join('')}</div>`;
    } else if (typeof data.html === 'string') {
      body = data.html;
    }

    el.innerHTML = `<div class="ds-card" style="width:100%;${h ? 'height:100%' : ''}">
      <div class="ds-head">${data.title || type}</div>
      <div class="ds-body">${body}</div>
    </div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== Layout helpers (overlap prevention) ===== */
  function below(el, gap) { if (gap === undefined) gap = 20; return parseFloat(el.style.top) + el.offsetHeight + gap; }
  function rightOf(el, gap) { if (gap === undefined) gap = 20; return parseFloat(el.style.left) + el.offsetWidth + gap; }
  function maxY(els, gap) { if (gap === undefined) gap = 20; return Math.max(...els.map(e => parseFloat(e.style.top) + e.offsetHeight)) + gap; }
  function maxX(els, gap) { if (gap === undefined) gap = 20; return Math.max(...els.map(e => parseFloat(e.style.left) + e.offsetWidth)) + gap; }

  /* ===== expose API ===== */
  window.canvas = { addSection, addTitle, addText, addTag, addContextCard, addDesignSystemCard, addColorSwatch, addTypeSample, addPage, addNote, addDiagram, below, rightOf, maxY, maxX };

  /* ===== demo scene ===== */
  /* Layout rules:
     - Vertical positioning uses below(el, gap) based on actual rendered height of the element above, no hardcoded Y
     - Horizontal positioning uses rightOf(el, gap) or fixed X (fixed values are fine when element widths are known)
     - Cross-row alignment uses maxY([all elements in that row], 80) to get the next row's starting Y
     - Always save the return value of each add* call to a variable for later element references
  */

    return '<div class="gn" style="height:auto;background:transparent">' + html + '</div>';

  /* design-system previews reuse the product components, so they need the
     token scope that .gn provides */
  function gnify(cardEl) {
    const body = cardEl.querySelector('.ds-body');
    if (!body) return cardEl;
    const wrap = document.createElement('div');
    wrap.className = 'gn';
    wrap.style.height = 'auto';
    wrap.style.background = 'transparent';
    while (body.firstChild) wrap.appendChild(body.firstChild);
    body.appendChild(wrap);
    return cardEl;
  }

        '<div style="font-family:Consolas,monospace;font-size:8.5px;letter-spacing:0.1em;color:#6d6885;margin:14px 0 8px">RADII</div>' +
        '<div style="display:flex;gap:10px;align-items:flex-end">' +
        rad(28, 7, '7') + rad(28, 10, '10') + rad(28, 14, '14') + rad(28, 14, 'pill') +
        '</div>' +
        '<div style="font-family:Consolas,monospace;font-size:8.5px;letter-spacing:0.1em;color:#6d6885;margin:16px 0 8px">LAYOUT</div>' +
        '<div style="font-size:10.5px;color:#8d87a6;line-height:1.7">Sidebar 246 · top bar 58<br>Content 1216 max, 28 gutter<br>Cards 14 · controls 10 · tags pill</div>'
    });

    function box(x, y, w, h, label, dashed) {
      return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="7" fill="#141226" stroke="' +
        (dashed ? 'rgba(185,168,255,0.4)' : 'rgba(142,111,255,0.32)') + '"' + (dashed ? ' stroke-dasharray="3 3"' : '') + '/>' +
        '<text x="' + (x + w / 2) + '" y="' + (y + 17) + '" text-anchor="middle" fill="#cfc9e6" font-size="10.5">' + label + '</text>';
    }

    function rad(size, r, label) {
      return '<div style="text-align:center"><div style="width:' + size + 'px;height:28px;border:1px solid rgba(142,111,255,0.45);border-radius:' + (label === 'pill' ? '999px' : r + 'px') + ';background:rgba(142,111,255,0.1)"></div>' +
        '<div style="font-family:Consolas,monospace;font-size:8.5px;color:#6d677f;margin-top:5px">' + label + '</div></div>';
    }

    /* ══ ROW 3 ═══════════════════════════════════════════════════════════ */
    [colorCard, typeCard, degreeCard, compCard, stateCard, gridCard].forEach(gnify);

    const r3 = maxY([compCard, stateCard, gridCard], 84);
    addSection(r3, '03 DESIGN DELIVERABLES');
    const pagesY = r3 + 74;

    const pages = [
      { label: 'A1  Sign in · /auth/login', html: authFrame({ step: 'email' }) },
      { label: 'A2  Password · /auth/check-password', html: authFrame({ step: 'password', email: 'alice@demo.test' }) },
      { label: 'A3  Password · error state', html: authFrame({ step: 'password-error', email: 'alice@demo.test' }) },
      { label: 'A4  Create password · /auth/create-password', html: authFrame({ step: 'create', email: 'jordan@mbeki.studio', pw: 'Demo@123', strength: 4 }) },
      { label: 'A5  Your name · /auth/register', html: authFrame({ step: 'name', name: 'Jordan Mbeki' }) },
      { label: 'B1  Overview · /', html: memberFrame('dashboard') },
      { label: 'C1  My network · degree tabs', html: memberFrame('network', { tab: 'first' }) },
      { label: 'D1  Discover · search and filters', html: memberFrame('discover') },
      { label: 'E1  Requests · received and sent', html: memberFrame('requests', { requestTab: 'received' }) },
      { label: 'F1  Profile · 2nd degree, list locked', html: memberFrame('profile', { profileId: 'dave' }) },
      { label: 'F2  Profile · 1st degree, list visible', html: memberFrame('profile', { profileId: 'carol' }) },
      { label: 'G1  Admin console · Neo4j graph + SQLite users', html: GNX.screens('admin', ST, { mode: 'frame', selected: 'dave' }) }
    ];

    /* connectors, drawn behind the frames */
    const totalW = (pages.length - 1) * PAGE_STEP + PAGE_W;
    let conn = '<div style="position:absolute;inset:0">' +
      '<svg viewBox="0 0 ' + totalW + ' ' + PAGE_H + '" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible">' +
      '<defs><marker id="pg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="rgba(142,111,255,0.85)"/></marker></defs>';
    for (let i = 0; i < pages.length - 1; i++) {
      const x1 = i * PAGE_STEP + PAGE_W + 10;
      const x2 = (i + 1) * PAGE_STEP - 10;
      const y = PAGE_H * 0.5;
      conn += '<path d="M' + x1 + ' ' + y + ' H' + x2 + '" stroke="rgba(142,111,255,0.72)" stroke-width="2.6" marker-end="url(#pg-arrow)"/>';
    }
    conn += '</svg></div>';
    const connEl = addDiagram(X0, pagesY, totalW, PAGE_H, conn);
    connEl.style.pointerEvents = 'none';
    connEl.style.zIndex = '0';

    /* group headers */
    addText(X0, pagesY - 40, 'AUTHENTICATION', { fontSize: 10.5, color: '#9c93bb' });
    addText(X0 + 5 * PAGE_STEP, pagesY - 40, 'MEMBER APPLICATION', { fontSize: 10.5, color: '#9c93bb' });
    addText(X0 + 11 * PAGE_STEP, pagesY - 40, 'ADMIN CONSOLE', { fontSize: 10.5, color: '#9c93bb' });

    pages.forEach(function (p, i) {
      addPage(X0 + i * PAGE_STEP, pagesY, PAGE_W, PAGE_H, p.label, p.html);
    });

    /* closing note under the flow */
    addNote(X0, pagesY + PAGE_H + 64, 'What to look at first',
      'The orbit map on the overview, the shortest-path strip on a 2nd degree profile, and the admin graph. Those three carry the idea that distance is the product, and each one is computed from the same edge list.');
  }

  initDemo();


  const r = viewport.getBoundingClientRect();
  const targetW = 1480;
  zoom = Math.max(0.18, Math.min(1, (r.width - 48) / targetW));
  panX = 24;
  panY = 12;
  updateTransform();
})();
</script>
</body>
</html>
